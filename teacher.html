<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사용 대시보드</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-6 bg-gray-100">

<h1 class="text-2xl font-bold mb-4">
📊 교사용 대시보드
</h1>

<button
onclick="loadData()"
class="bg-blue-600 text-white px-4 py-2 rounded mb-4">
새로고침
</button>

<table class="w-full border bg-white">

<thead>

<tr>

<th class="border p-2">시간</th>
<th class="border p-2">식물명</th>
<th class="border p-2">학명</th>
<th class="border p-2">구분</th>

</tr>

</thead>

<tbody id="tableBody">
</tbody>

</table>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbx8H41i-jFnHilzlFjJtqlLuXhRJEFZBkTonZvXYPnsJOP9hnGfr05ZOr7I4VAP5tTjXQ/exec";

let records = [];

async function loadData(){

  try{

    const response =
      await fetch(GAS_URL);

    records =
      await response.json();

    renderTable();

  }
  catch(error){

    console.error(error);

    alert("데이터 불러오기 실패");

  }

}

function renderTable(){

  const tbody =
    document.getElementById("tableBody");

  tbody.innerHTML = "";

  records.reverse().forEach(item=>{

    tbody.innerHTML += `

      <tr>

        <td class="border p-2">
          ${item.time}
        </td>

        <td class="border p-2">
          ${item.plant}
        </td>

        <td class="border p-2">
          ${item.scientific}
        </td>

        <td class="border p-2">
          ${item.alien}
        </td>

      </tr>

    `;

  });

}

loadData();

</script>

</body>
</html>
