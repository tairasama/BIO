<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>교사용 대시보드</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>

const pin = prompt(
"교사용 비밀번호 입력"
);

if(pin !== "1234"){

  alert("접근불가");

  location.href="index.html";

}

</script>

</head>

<body class="bg-slate-100 p-6">

<div
class="max-w-6xl mx-auto">

<div
class="flex justify-between mb-4">

<h1
class="text-3xl font-bold">

📊 식물 탐사 대시보드

</h1>

<button
onclick="loadData()"
class="bg-blue-600 text-white px-4 py-2 rounded">

새로고침

</button>

</div>

<div
class="bg-white rounded-xl shadow p-4">

<button
onclick="downloadCSV()"
class="bg-green-600 text-white px-4 py-2 rounded mb-4">

CSV 다운로드

</button>

<table
class="w-full border">

<thead>

<tr
class="bg-slate-100">

<th class="border p-2">시간</th>

<th class="border p-2">식물명</th>

<th class="border p-2">학명</th>

<th class="border p-2">구분</th>

</tr>

</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbx8H41i-jFnHilzlFjJtqlLuXhRJEFZBkTonZvXYPnsJOP9hnGfr05ZOr7I4VAP5tTjXQ/exec";

let records=[];

async function loadData(){

const res =
await fetch(GAS_URL);

records =
await res.json();

renderTable();

}

function renderTable(){

const tbody =
document.getElementById(
"tableBody"
);

tbody.innerHTML="";

if(records.length===0){

tbody.innerHTML=`

<tr>

<td colspan="4"
class="p-6 text-center">

데이터 없음

</td>

</tr>

`;

return;

}

records.reverse().forEach(r=>{

tbody.innerHTML += `

<tr>

<td class="border p-2">
${new Date(r.time)
.toLocaleString()}
</td>

<td class="border p-2">
${r.plant}
</td>

<td class="border p-2">
${r.scientific}
</td
