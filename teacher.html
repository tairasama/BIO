<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>교사용 대시보드</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>

const pin = prompt(
"교사용 비밀번호 입력"
);

if(pin !== "1234"){

  alert("접근불가");

  location.href="index.html";

}

</script>

</head>

<body class="bg-slate-100 p-6">

<div
class="max-w-6xl mx-auto">

<div
class="flex justify-between mb-4">

<h1
class="text-3xl font-bold">

📊 식물 탐사 대시보드

</h1>

<button
onclick="loadData()"
class="bg-blue-600 text-white px-4 py-2 rounded">

새로고침

</button>

</div>

<div
class="bg-white rounded-xl shadow p-4">

<button
onclick="downloadCSV()"
class="bg-green-600 text-white px-4 py-2 rounded mb-4">

CSV 다운로드

</button>

<table
class="w-full border">

<thead>

<tr
class="bg-slate-100">

<th class="border p-2">시간</th>

<th class="border p-2">식물명</th>

<th class="border p-2">학명</th>

<th class="border p-2">구분</th>

</tr>

</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbx8H41i-jFnHilzlFjJtqlLuXhRJEFZBkTonZvXYPnsJOP9hnGfr05ZOr7I4VAP5tTjXQ/exec";

let records=[];

async function loadData(){

const res =
await fetch(GAS_URL);

records =
await res.json();

renderTable();

}

function downloadCSV(){

  let csv =
  "시간,식물명,학명,구분\n";

  records.forEach(r=>{

    csv +=
    `${r.time},${r.plant},${r.scientific},${r.alien}\n`;

  });

  const blob =
  new Blob(
    ["\uFEFF"+csv],
    {type:"text/csv;charset=utf-8;"}
  );

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(blob);

  a.download =
  "plant_logs.csv";

  a.click();

}



loadData();

setInterval(loadData,10000);

</script>

</body>

</html>
