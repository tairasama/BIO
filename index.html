<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리동네 식물 탐사</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-emerald-50 min-h-screen p-4">

<div class="max-w-md mx-auto bg-white rounded-2xl shadow-md p-6 border border-emerald-100">

  <h1 class="text-2xl font-bold text-emerald-800 mb-1">
    🌱 우리동네 식물 탐사
  </h1>

  <p class="text-sm text-gray-500 mb-6">
    식물을 촬영하고 제출해보세요.
  </p>

  <!-- 학번 -->
  <div class="mb-4">

    <label class="block mb-2 font-semibold">
      학번
    </label>

    <input
      type="text"
      id="studentId"
      placeholder="예: 20301"
      class="w-full border rounded-lg p-3">

  </div>

  <!-- 위치 표시 -->
  <div class="mb-4">

    <p
      id="locationText"
      class="text-sm text-gray-600">

      위치 확인 중...

    </p>

  </div>

  <!-- 사진 업로드 -->

  <div class="mb-6">

    <label
      class="block w-full border-2 border-dashed border-emerald-300 rounded-xl p-6 text-center cursor-pointer">

      <input
        type="file"
        accept="image/*"
        capture="environment"
        class="hidden"
        onchange="previewAndIdentify(event)">

      <div id="uploadPrompt">

        <span class="text-4xl">
          📸
        </span>

        <p class="mt-2 text-sm text-emerald-700 font-semibold">
          식물 사진 촬영 / 올리기
        </p>

      </div>

      <img
        id="imagePreview"
        class="hidden w-full h-48 object-cover rounded-lg">

    </label>

  </div>

  <!-- 결과 -->

  <div
    id="resultCard"
    class="hidden bg-gray-50 rounded-xl p-4 mb-6 border">

    <div class="flex justify-between">

      <div>

        <h2
          id="plantName"
          class="text-xl font-bold">

          식물 미확인

        </h2>

        <p
          id="scientificName"
          class="text-xs text-gray-400 italic">

          -

        </p>

      </div>

      <span
        id="alienBadge"
        class="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded-full">

        ✅ 일반종

      </span>

    </div>

  </div>

  <button
    id="submitBtn"
    onclick="submitObservation()"
    class="hidden w-full bg-emerald-600 text-white font-bold py-3 rounded-xl">

    제출하기 🚀

  </button>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbwnlW8uoi77viKxY7IQSmY-dgSMSVQQDXqQSTinq-qHKfGz0VbXTJyOEDKqKu6ALgOuBg/exec";

let currentLatitude = "";
let currentLongitude = "";

function getLocation(){

  if(!navigator.geolocation){

    document.getElementById(
      "locationText"
    ).innerText =
      "위치 사용 불가";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position){

      currentLatitude =
        position.coords.latitude;

      currentLongitude =
        position.coords.longitude;

      document.getElementById(
        "locationText"
      ).innerText =
      `위도 ${currentLatitude.toFixed(5)}, 경도 ${currentLongitude.toFixed(5)}`;

    },

    function(){

      document.getElementById(
        "locationText"
      ).innerText =
      "위치 권한 필요";

    }

  );

}

getLocation();

function previewAndIdentify(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload =
  function(e){

    document.getElementById(
      "imagePreview"
    ).src =
    e.target.result;

    document.getElementById(
      "imagePreview"
    ).classList.remove("hidden");

    document.getElementById(
      "uploadPrompt"
    ).classList.add("hidden");

    document.getElementById(
      "resultCard"
    ).classList.remove("hidden");

    document.getElementById(
      "submitBtn"
    ).classList.remove("hidden");

    /* 임시 식물명 */
    document.getElementById(
      "plantName"
    ).innerText =
    "식물 관찰";

    document.getElementById(
      "scientificName"
    ).innerText =
    "Plant Observation";

  };

  reader.readAsDataURL(file);

}

async function submitObservation(){

  const studentId =
    document.getElementById(
      "studentId"
    ).value.trim();

  if(studentId === ""){

    alert("학번을 입력하세요.");

    return;

  }

  const data = {

    studentId:

      studentId,

    latitude:

      currentLatitude,

    longitude:

      currentLongitude,

    plant:

      document.getElementById(
        "plantName"
      ).innerText,

    scientific:

      document.getElementById(
        "scientificName"
      ).innerText,

    alien:

      document.getElementById(
        "alienBadge"
      ).innerText

  };

  try{

    await fetch(
      GAS_URL,
      {
        method:"POST",
        body:JSON.stringify(data)
      }
    );

    alert("제출 완료!");

  }

  catch(error){

    console.error(error);

    alert("전송 실패");

  }

}

</script>

</body>
</html>
