<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네이처링 학생용 - 식물 탐사대</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50 min-h-screen p-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-md p-6 border border-emerald-100">
    <h1 class="text-2xl font-bold text-emerald-800 mb-1">🌱 우리동네 식물 탐사</h1>
    <p class="text-sm text-gray-500 mb-6">사진을 찍어 식물을 찾고 외래종인지 확인해보세요!</p>

    <!-- 사진 업로드 영역 -->
    <div class="mb-6">
      <label class="block w-full border-2 border-dashed border-emerald-300 rounded-xl p-6 text-center cursor-pointer hover:bg-emerald-50 transition">
        <input type="file" accept="image/*" capture="environment" id="photoInput" class="hidden" onchange="previewAndIdentify(event)">
        <div id="uploadPrompt">
          <span class="text-4xl">📸</span>
          <p class="mt-2 text-sm text-emerald-700 font-semibold">식물 사진 촬영 / 올리기</p>
        </div>
        <img id="imagePreview" class="hidden w-full h-48 object-cover rounded-lg">
      </label>
    </div>

    <!-- 탐사 제출 폼 -->
    <div id="resultCard" class="hidden bg-gray-50 rounded-xl p-4 mb-6 border">
      <div class="flex justify-between items-start mb-2">
        <div>
          <h2 id="plantName" class="text-xl font-bold text-gray-800">서양등골나물</h2>
          <p id="scientificName" class="text-xs text-gray-400 italic">Ageratina altissima</p>
        </div>
        <!-- 외래종 태그 -->
        <span id="alienBadge" class="bg-red-100 text-red-600 text-xs font-bold px-2.5 py-1 rounded-full">⚠️ 생태계교란 외래종</span>
      </div>
      <p id="plantInfo" class="text-xs text-gray-600 mt-2">북아메리카 원산의 다년생 초본으로 다른 식물의 생장을 방해합니다.</p>
    </div>

    <button onclick="submitObservation()" id="submitBtn" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">
      교실 지도로 제출하기 🚀
    </button>
  </div>

  <script>
    function previewAndIdentify(event) {
      const file = event.target.files[0];
      if (file) {
       reader.onload = async function(e) {

  const imageData = e.target.result;

  document.getElementById('imagePreview').src =
    imageData;

  document.getElementById('imagePreview')
    .classList.remove('hidden');

  document.getElementById('uploadPrompt')
    .classList.add('hidden');

  await identifyPlant(file);

}
        reader.readAsDataURL(file);
      }
    }

const PLANTNET_API_KEY =
"2b10Dbl8D6g1uEbuVSWc8QZILu";

async function identifyPlant(file){

  const formData =
    new FormData();

  formData.append(
    "images",
    file
  );

  formData.append(
    "organs",
    "leaf"
  );

  try{

    const response =
      await fetch(

`https://my-api.plantnet.org/v2/identify/all?api-key=${PLANTNET_API_KEY}`,

      {
        method:"POST",
        body:formData
      }

    );

    const data =
      await response.json();

    if(!data.results ||
       data.results.length===0){

      alert("식물을 찾을 수 없습니다.");

      return;
    }

    const result =
      data.results[0];

    const commonName =
      result.species
      .commonNames?.[0]
      || "이름 없음";

    const scientificName =
      result.species
      .scientificNameWithoutAuthor
      || "확인 불가";

    document.getElementById(
      "plantName"
    ).innerText =
      commonName;

    document.getElementById(
      "scientificName"
    ).innerText =
      scientificName;

    document.getElementById(
      "resultCard"
    ).classList.remove("hidden");

    document.getElementById(
      "submitBtn"
    ).classList.remove("hidden");

    checkAlienSpecies(
      commonName,
      scientificName
    );

  }

  catch(err){

    console.error(err);

    alert(
      "식물 판별 실패"
    );

  }

}
function checkAlienSpecies(
  commonName,
  scientificName
){

  const alienList = [

    "Ageratina altissima",
    "Ambrosia artemisiifolia",
    "Sicyos angulatus",
    "Lactuca scariola"

  ];

  const badge =
    document.getElementById(
      "alienBadge"
    );

  if(
    alienList.includes(
      scientificName
    )
  ){

    badge.innerText =
      "⚠️ 생태계교란 외래종";

    badge.className =
      "bg-red-100 text-red-600 text-xs font-bold px-2 py-1 rounded-full";

  }

  else{

    badge.innerText =
      "✅ 일반종";

    badge.className =
      "bg-green-100 text-green-600 text-xs font-bold px-2 py-1 rounded-full";

  }

}
   const GAS_URL =
"https://script.google.com/macros/s/AKfycbx8H41i-jFnHilzlFjJtqlLuXhRJEFZBkTonZvXYPnsJOP9hnGfr05ZOr7I4VAP5tTjXQ/exec";


async function submitObservation() {

  const data = {

    plant:
      document.getElementById(
        "plantName"
      ).innerText,

    scientific:
      document.getElementById(
        "scientificName"
      ).innerText,

    alien:
      document.getElementById(
        "alienBadge"
      ).innerText

  };

try {

  const response = await fetch(GAS_URL,{
    method:"POST",
    body:JSON.stringify(data)
  });

  const result = await response.text();

  console.log(result);

  alert("제출 완료!");

  location.reload();

}
catch(err){

  console.error(err);

  alert("전송 실패");

}

}
  </script>
</body>
</html>
